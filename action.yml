name: git-judge-jev
description: One PR comment that says what the PR really does, which hunks need a human, why, and what to verify. Runs on TypeSafe Jev.
author: David Rydberg
branding:
  icon: eye
  color: gray-dark

inputs:
  typesafe-api-key:
    description: TypeSafe API key, used to judge every hunk with Jev.
    required: true
  openai-api-key:
    description: OpenAI API key. Needed when the generator model in the policy is an OpenAI model, which is the default.
    required: false
  anthropic-api-key:
    description: Anthropic API key. Needed only when the policy names a Claude model, for example for escalation.
    required: false
  github-token:
    description: Token used to read the diff and to write comments and labels.
    required: false
    default: ${{ github.token }}

outputs:
  conclusion:
    description: success, failure, or did_not_run.
  json:
    description: The full report as JSON. Every verdict, the whole reading order, every raw Jev answer.
  handoff:
    description: What the comment tells a coding agent, as JSON. Each finding with what to do about it and when it counts as resolved.

runs:
  using: node24
  main: dist/index.cjs
